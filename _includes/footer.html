<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <h2 class="footer-heading">{{ site.title | escape }}</h2>

    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
          <li class="p-name">
            {%- if site.author -%}
              {{ site.author | escape }}
            {%- else -%}
              {{ site.title | escape }}
            {%- endif -%}
          </li>
          <li><a href="{{ "/feed.xml" | relative_url }}">RSS 订阅</a></li>
        </ul>
      </div>

      <div class="footer-col footer-col-2">
        {%- include social.html -%}
        <!--
          GitHub Sponsors 按钮占位，当前不启用，页面上不会显示。
          将来若要打开，去掉这段注释，并把 USER 换成 GitHub 用户名：
          <p class="sponsors-slot">
            <iframe src="https://github.com/sponsors/USER/button" title="Sponsor USER" height="32" width="114" style="border: 0; border-radius: 6px;"></iframe>
          </p>
        -->
      </div>

      <div class="footer-col footer-col-3">
        <p>{{- site.description | escape -}}</p>
      </div>
    </div>

  </div>

</footer>
<script data-goatcounter="https://yum412517.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
