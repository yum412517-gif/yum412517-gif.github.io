{%- assign cat_id = include.name -%}
{%- for item in site.category_order -%}
  {%- if item.name == include.name -%}
    {%- assign cat_id = item.id -%}
  {%- endif -%}
{%- endfor -%}
<a class="page__taxonomy-item p-category category-link" href="{{ '/categories/' | relative_url }}#{{ cat_id }}" rel="tag">{{ include.name | escape }}</a>
