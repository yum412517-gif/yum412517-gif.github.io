title: AI 每日精选
subtitle: 精选人工智能新技术、最佳实践与实用干货。
description: 精选人工智能新技术、最佳实践与实用干货。
name: AI 每日精选
lang: zh-CN
locale: zh-CN
timezone: Asia/Shanghai

url: https://yum412517-gif.github.io
baseurl: ""
repository: yum412517-gif/yum412517-gif.github.io

# GitHub Pages stays "Deploy from a branch", branch main, folder / (root).
# remote_theme and jekyll-include-cache are both in the github-pages 232
# whitelist (https://pages.github.com/versions.json), so this does not need
# a Pages Actions workflow. Pin the theme ref so production builds stay put.
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
# "contrast" is the light high-contrast skin (black text, blue links).
# "dark" is light text on a dark background.
minimal_mistakes_skin: "dark"

markdown: kramdown
highlighter: rouge
future: false
show_excerpts: true
# Keep category names out of URLs. Default "date" style inserts /:categories/.
permalink: /:year/:month/:day/:title/
date_format: "%Y-%m-%d"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

kramdown:
  input: GFM
  syntax_highlighter: rouge

author:
  name: AI 每日精选

footer:
  links:
    - label: GitHub
      icon: "fab fa-fw fa-github"
      url: "https://github.com/yum412517-gif"

feed:
  path: feed.xml

# Fixed category order. Names must match post front matter exactly.
# Anchors on /categories/ use these ids. Jekyll slugify drops CJK, so the
# theme's default category links are overridden in _includes/category-link.html.
category_order:
  - name: AI 新技术
    id: ai-new-tech
    description: 模型、框架、工具和值得留意的新进展。
  - name: AI 最佳实践
    id: ai-best-practices
    description: 写提示、做评测、上线和协作时更稳妥的做法。
  - name: AI 实用干货
    id: ai-practical
    description: 命令、代码片段和可以立刻复用的技巧。

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      show_date: true
      read_time: false
      comments: false
      share: false
      related: false
      author_profile: false
  - scope:
      path: ""
      type: pages
    values:
      author_profile: false
      comments: false
      share: false

exclude:
  - README.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
  - .bundle
